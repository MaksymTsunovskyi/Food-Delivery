version: 2

models:
  - name: stg_customers
    description: "Очищена таблиця клієнтів"
    columns:
      - name: customer_id
        description: "Унікальний ID клієнта"
        tests:
          - unique
          - not_null

  - name: mart_orders
    description: "Фінальна вітрина замовлень доставки їжі, що містить деталі замовлень, клієнтів, ресторанів та кур'єрів."
    columns:
      - name: order_id
        description: "Унікальний ідентифікатор замовлення"
        tests:
          - unique
          - not_null